<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title">
  <title id="title">D and Z monogram</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4"/>
      <stop offset="35%" stop-color="#dfc15d"/>
      <stop offset="70%" stop-color="#b38a2e"/>
      <stop offset="100%" stop-color="#fcedb4"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b1426"/>
      <stop offset="100%" stop-color="#3d0a14"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ornate Royal Base -->
  <rect x="6" y="6" width="148" height="148" rx="8" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
  <rect x="12" y="12" width="136" height="136" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.75"/>

  <!-- Corner Flourishes -->
  <circle cx="16" cy="16" r="2" fill="url(#goldGrad)"/>
  <circle cx="144" cy="16" r="2" fill="url(#goldGrad)"/>
  <circle cx="16" cy="144" r="2" fill="url(#goldGrad)"/>
  <circle cx="144" cy="144" r="2" fill="url(#goldGrad)"/>

  <!-- Royal Crown Motif -->
  <path d="M68 28 L74 34 L80 24 L86 34 L92 28 L90 38 L70 38 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="80" cy="22" r="1.5" fill="url(#goldGrad)"/>

  <!-- Interlocking Monogram D & Z -->
  <!-- D -->
  <path d="M44 48 H68 C88 48 102 60 102 82 C102 104 88 116 68 116 H44 V48 Z M54 58 V106 H68 C82 106 91 96 91 82 C91 68 82 58 68 58 H54 Z" fill="url(#goldGrad)"/>
  <!-- Z (overlapped with luxury cut) -->
  <path d="M72 58 H114 L78 106 H118 V114 H68 L104 66 H72 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Subtitle -->
  <text x="80" y="134" fill="url(#goldGrad)" font-family="'Cinzel', 'Times New Roman', serif" font-size="8" font-weight="600" letter-spacing="3" text-anchor="middle">SURAT</text>
</svg>