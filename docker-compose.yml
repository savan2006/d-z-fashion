services:
  postgres:
    image: postgres:15-alpine
    container_name: dz-fashion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/seed/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./scripts/seed/seed-demo-data.sql:/docker-entrypoint-initdb.d/02-seed-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: identity-service
    container_name: dz-identity-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      IDENTITY_DB_USERNAME: postgres
      IDENTITY_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      IDENTITY_SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: catalog-service
    container_name: dz-catalog-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      CATALOG_DB_USERNAME: postgres
      CATALOG_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      CATALOG_SERVICE_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: dz-inventory-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      INVENTORY_DB_USERNAME: postgres
      INVENTORY_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      INVENTORY_SERVICE_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  commerce-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: commerce-service
    container_name: dz-commerce-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      COMMERCE_DB_USERNAME: postgres
      COMMERCE_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      COMMERCE_SERVICE_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: dz-payment-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      PAYMENT_DB_USERNAME: postgres
      PAYMENT_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      PAYMENT_SERVICE_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  fulfillment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: fulfillment-service
    container_name: dz-fulfillment-service
    restart: unless-stopped
    environment:
      SUPABASE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?sslmode=disable
      FULFILLMENT_DB_USERNAME: postgres
      FULFILLMENT_DB_PASSWORD: postgres
      JWT_ISSUER: dz-fashion
      JWT_SECRET: dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!
      FULFILLMENT_SERVICE_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: dz-api-gateway
    restart: unless-stopped
    environment:
      IDENTITY_HOST: identity-service
      IDENTITY_PORT: 8081
      CATALOG_HOST: catalog-service
      CATALOG_PORT: 8082
      INVENTORY_HOST: inventory-service
      INVENTORY_PORT: 8083
      COMMERCE_HOST: commerce-service
      COMMERCE_PORT: 8084
      PAYMENT_HOST: payment-service
      PAYMENT_PORT: 8085
      FULFILLMENT_HOST: fulfillment-service
      FULFILLMENT_PORT: 8086
      API_GATEWAY_PORT: 8080
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - inventory-service
      - commerce-service
      - payment-service
      - fulfillment-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: dz-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  pgdata:
    driver: local
