spring:
  application:
    name: payment-service
  datasource:
    url: ${SUPABASE_JDBC_URL:}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: payment
    schemas: payment
    create-schemas: true

jwt:
  issuer: dz-fashion-identity
  secret: ${JWT_SECRET:d-z-fashion-super-secret-key-for-local-development-minimum-32-chars!}

payment:
  seller-legal-name: ${SELLER_LEGAL_NAME:D & Z Fashion}
  seller-gstin: ${SELLER_GSTIN:24AAACD1234E1Z5}
  seller-address: ${SELLER_ADDRESS:Surat Central Warehouse, Ring Road, Surat, Gujarat - 395002}
  seller-state: ${SELLER_STATE:Gujarat}
  default-gst-rate-percent: 5.00
  shipping-gst-rate-percent: 18.00

server:
  port: ${PAYMENT_SERVICE_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dzfashion: ${LOG_LEVEL_DZ:INFO}
