spring:
  application:
    name: catalog-service
  datasource:
    url: ${SUPABASE_JDBC_URL:}
    username: ${CATALOG_DB_USERNAME:postgres}
    password: ${CATALOG_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: catalog
    schemas: catalog
    create-schemas: true

jwt:
  issuer: dz-fashion-identity
  secret: ${JWT_SECRET:d-z-fashion-super-secret-key-for-local-development-minimum-32-chars!}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dzfashion}
  api-key: ${CLOUDINARY_API_KEY:mock-key}
  api-secret: ${CLOUDINARY_API_SECRET:mock-secret}
  folder: ${CLOUDINARY_FOLDER:dzfashion/catalog}

server:
  port: ${CATALOG_SERVICE_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dzfashion: ${LOG_LEVEL_DZ:INFO}
