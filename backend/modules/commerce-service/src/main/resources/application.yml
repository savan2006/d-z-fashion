spring:
  application:
    name: commerce-service
  datasource:
    url: ${SUPABASE_JDBC_URL:}
    username: ${COMMERCE_DB_USERNAME:postgres}
    password: ${COMMERCE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: commerce
    schemas: commerce
    create-schemas: true

jwt:
  issuer: ${JWT_ISSUER:dz-fashion}
  secret: ${JWT_SECRET:dz-fashion-secure-jwt-signing-secret-key-minimum-32-bytes!}

commerce:
  gst-rate-percent: 5.00
  free-delivery-threshold: 2000.00
  per-unit-delivery-fee: 110.00
  catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

server:
  port: ${COMMERCE_SERVICE_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dzfashion: ${LOG_LEVEL_DZ:INFO}
